name: FreshMart Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      TF_VAR_aws_region: ap-southeast-1
      TF_VAR_environment: dev
      TF_VAR_internal_service_token: ${{ secrets.TF_VAR_INTERNAL_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@v3
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Package Lambdas
        run: npm run package
      - name: Terraform Init
        run: terraform -chdir=terraform/environments/dev init
      - name: Terraform Apply
        run: terraform -chdir=terraform/environments/dev apply -auto-approve
      - name: Deploy Frontend
        run: npm run deploy:web
      - name: Verify Web
        run: node scripts/verify-web.js
      - name: Smoke Test
        run: npm run test:smoke:deployment
        env:
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
