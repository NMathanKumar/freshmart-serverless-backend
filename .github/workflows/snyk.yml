name: FreshMart Snyk Security Scan

on:
  push:
    branches: [main, develop, 'sonar/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every Monday at 09:00 UTC to catch new CVEs
    - cron: '0 9 * * 1'

jobs:
  snyk-open-source:
    name: Snyk Open Source — Dependency Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Snyk — Authenticate
        run: npx snyk auth ${{ secrets.SNYK_TOKEN }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk — Test Open Source Dependencies
        # continue-on-error so we get full report even if there are vulns
        continue-on-error: true
        run: |
          npx snyk test \
            --all-projects \
            --severity-threshold=high \
            --json-file-output=snyk-oss-results.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk — Monitor (Track project over time)
        continue-on-error: true
        run: |
          npx snyk monitor \
            --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk OSS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-oss-results
          path: snyk-oss-results.json
          retention-days: 30

  snyk-code:
    name: Snyk Code — SAST Source Code Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Snyk — Code SAST Analysis
        continue-on-error: true
        run: |
          npx snyk code test \
            --severity-threshold=high \
            --json-file-output=snyk-code-results.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk Code Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-code-results
          path: snyk-code-results.json
          retention-days: 30

  snyk-iac:
    name: Snyk IaC — Terraform Infrastructure Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snyk — IaC Terraform Scan
        continue-on-error: true
        run: |
          npx snyk iac test terraform/ \
            --severity-threshold=high \
            --json-file-output=snyk-iac-results.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk IaC Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-iac-results
          path: snyk-iac-results.json
          retention-days: 30

  snyk-report:
    name: Snyk — Consolidated Report
    runs-on: ubuntu-latest
    needs: [snyk-open-source, snyk-code, snyk-iac]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Download All Snyk Results
        uses: actions/download-artifact@v4
        with:
          pattern: snyk-*-results
          merge-multiple: true

      - name: Print Snyk Summary
        shell: bash
        run: |
          echo "===== SNYK SECURITY SCAN SUMMARY ====="
          for f in snyk-oss-results.json snyk-code-results.json snyk-iac-results.json; do
            if [ -f "$f" ]; then
              echo ""
              echo "--- $f ---"
              # Extract high/critical counts using python for portability
              python3 -c "
          import json, sys
          try:
              data = json.load(open('$f'))
              vulns = data.get('vulnerabilities', []) or data.get('runs', [{}])[0].get('results', [])
              highs = [v for v in vulns if isinstance(v, dict) and str(v.get('severity','')).lower() in ('high','critical')]
              print(f'  Total findings : {len(vulns)}')
              print(f'  High/Critical  : {len(highs)}')
          except Exception as e:
              print(f'  Could not parse results: {e}')
          " || echo "  (result file not parseable as expected format)"
            else
              echo "--- $f: NOT GENERATED ---"
            fi
          done
          echo ""
          echo "Full results uploaded as GitHub Actions artifacts."
          echo "Review findings before approving production deployment."
