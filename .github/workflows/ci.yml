name: FreshMart CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      TF_VAR_aws_region: ap-southeast-1
      TF_VAR_environment: dev
      TF_VAR_internal_service_token: ${{ secrets.TF_VAR_INTERNAL_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@v3
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Terraform Format Check
        run: terraform -chdir=terraform/environments/dev fmt -check
      - name: Terraform Init
        run: terraform -chdir=terraform/environments/dev init -backend=false
      - name: Terraform Validate
        run: terraform -chdir=terraform/environments/dev validate
