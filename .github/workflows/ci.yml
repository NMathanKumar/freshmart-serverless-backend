# DEPRECATED — This workflow has been retired.
#
# All checks previously performed here are now covered by ci-backend.yml:
#   - npm test            → backend-quality-matrix (all 15 services)
#   - npm run typecheck   → package-services action
#   - npm run build       → package-services action
#   - terraform fmt       → terraform-validation job (dev / qa / prod)
#   - terraform validate  → terraform-validation job (dev / qa / prod)
#
# This file is kept for audit history. It will not run automatically.
# If you need to trigger it manually for debugging, use workflow_dispatch.
#
# Retired: 2026-08 as part of Phase 1 CI/CD Maturity Upgrade (Stage 2 → 5)

name: "[RETIRED] FreshMart CI"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manually triggering this retired workflow"
        required: true
        default: "debugging only"

jobs:
  retired-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Retirement Notice
        shell: bash
        run: |
          echo "## ⚠️ This workflow is retired" >> $GITHUB_STEP_SUMMARY
          echo "All checks are now handled by **ci-backend.yml**." >> $GITHUB_STEP_SUMMARY
          echo "Triggered manually by: ${{ github.actor }} — ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "This workflow was retired as part of Phase 1 CI/CD Maturity Upgrade."
          echo "See .github/workflows/ci-backend.yml for the active pipeline."
