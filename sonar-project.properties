# FreshMart SonarQube / SonarCloud Configuration
# ==============================================================================
# Project identity
sonar.projectKey=freshmart-serverless-backend
sonar.projectName=FreshMart Serverless Backend
sonar.organization=nmathankumar
sonar.host.url=https://sonarcloud.io

# Source & Test paths (Includes services, packages, customer-web, and admin-web)
sonar.sources=services,packages,apps/customer-web/src,apps/admin-web/src
sonar.tests=services,packages,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js

# Exclusions for build artifacts, dependencies, and generated code
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.serverless/**,\
  **/coverage/**,\
  **/lambda.zip,\
  **/*.d.ts,\
  **/.terraform/**

# LCOV Test Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript Configuration
sonar.typescript.tsconfigPath=tsconfig.base.json

# Quality Gate & Security Settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.cpd.exclusions=**/test/**,**/*.test.*,**/*.spec.*
sonar.security.hotspots.inheritFromParent=true
