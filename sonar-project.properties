# ─────────────────────────────────────────────────────────────
# FreshMart SonarQube / SonarCloud Configuration
# ─────────────────────────────────────────────────────────────

# Project identity
sonar.projectKey=freshmart-serverless-backend
sonar.projectName=FreshMart Serverless Backend
sonar.projectVersion=2.0.0
sonar.organization=freshmart

# ─── Sources & Tests ───────────────────────────────────────
sonar.sources=services,packages
sonar.tests=services,packages,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js

# ─── Exclusions ────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.serverless/**,\
  **/coverage/**,\
  **/lambda.zip,\
  **/*.d.ts,\
  **/.terraform/**,\
  **/apps/**

# ─── Coverage Reports (LCOV) ───────────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ─── TypeScript ────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.base.json

# ─── Quality Gate thresholds ───────────────────────────────
# These are enforced on the Sonar server via Quality Gate profile.
# The pipeline uses SonarSource/sonarqube-quality-gate-action to
# BLOCK the PR merge if the quality gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# ─── Duplication threshold ────────────────────────────────
# Pipeline fails if duplicate code exceeds 3%
sonar.cpd.exclusions=**/test/**,**/*.test.*,**/*.spec.*

# ─── Cognitive Complexity ─────────────────────────────────
# Threshold set on Sonar Quality Gate profile (max 15 per method)

# ─── Security ─────────────────────────────────────────────
sonar.security.hotspots.inheritFromParent=true
